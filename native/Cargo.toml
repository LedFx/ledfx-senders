[package]
name = "ledfx-senders"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
publish = false
autotests = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
socket2 = "0.6"
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
rtc-dtls = { version = "=0.21.0", default-features = false, features = ["crypto-ring"] }
rtc-crypto = { version = "=0.21.0", default-features = false, features = ["crypto-ring"] }
ring = "=0.17.14"
bytes = "=1.12.0"
rtc-shared = { version = "=0.21.0", default-features = false }

[profile.release]
debug = 1

[[bin]]
name = "ledfx-receiver"
path = "bench/receiver/main.rs"

[[example]]
name = "hue-probe"
path = "bench/hue_probe/main.rs"
