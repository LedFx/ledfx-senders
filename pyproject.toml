[project]
name = "ledfx-senders"
version = "0.3.1"
description = "Native packet senders for Python applications"
requires-python = ">=3.11,<3.16"
dependencies = ["numpy>=2.0.0,<3.0.0"]
license = { text = "GPL-3.0 License" }
readme = "README.md"
authors = [{ name = "LedFx Developers" }]

[project.urls]
Homepage = "https://github.com/LedFx/ledfx-senders"
Repository = "https://github.com/LedFx/ledfx-senders"
Issues = "https://github.com/LedFx/ledfx-senders/issues"

[dependency-groups]
wheel-build = ["cibuildwheel==4.2.1"]
dev = ["pytest>=8,<10", "hypothesis", "ruff==0.16.8", "actionlint-py==1.7.12.24", "shellcheck-py==0.11.0.1", "zizmor==1.30.1", "prek>=0.5.3", "pyrefly==1.3.1", "setuptools-rust>=1.12", "numpy>=2.0.0,<3.0.0"]

[tool.uv]
required-version = ">=0.12.12"
exclude-newer = "14 days"
default-groups = []

[build-system]
requires = ["pdm-backend", "setuptools>=80", "setuptools-rust>=1.12"]
build-backend = "pdm.backend"

[tool.pdm.build]
run-setuptools = true
includes = ["src/ledfx_senders"]
source-includes = ["pdm_build.py", "native/Cargo.toml", "native/Cargo.lock", "native/src", "native/tests", "native/bench", "native/build.rs", "rust-toolchain.toml", "tests", "ci"]
excludes = ["native/target/**", "**/__pycache__/**", "**/.pytest_cache/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "dist", "build", "native"]

[tool.cibuildwheel]
build = "cp3{11,12,13,14,15}-* cp3{14,15}t-*"
skip = "*-musllinux_* *-win32 *-win_arm64"
archs = "native"
# FT 3.14+ is enabled by default; cibuildwheel 4 removed experimental 3.13t.
# 3.15 is explicitly selected even with cibuildwheel releases from its beta period.
enable = ["cpython-prerelease"]
# Exact pins avoid cmd.exe interpreting range operators in cibuildwheel's
# Windows shell=True pip invocation. Keep aligned with the tested dev lock.
test-requires = ["pytest==9.1.1", "hypothesis==6.168.0"]
test-command = "python -I {project}/ci/native_wheel_smoke.py && python -I -m pytest --noconftest {project}/tests -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514"
before-all = "bash {project}/ci/install-native-rust.sh"
environment = { CARGO_TARGET_DIR = "/tmp/ledfx-native-target", CARGO_HOME = "/opt/ledfx-cargo", RUSTUP_HOME = "/opt/ledfx-rustup", PATH = "/opt/ledfx-cargo/bin:$PATH" }

# Rust's x86_64 floor is 10.12. cibuildwheel raises this to each interpreter's
# own floor (3.12–3.13: 10.13; 3.14+: 10.15). ARM starts at macOS 11.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pyrefly]
preset = "strict"
python-platform = "linux"
project-includes = ["**/*.py", "**/*.pyi"]
# Source is checked even when a developer has an editable install.
search-path = ["src", "tests", "."]

[tool.pyrefly.errors]
explicit-any = "error"

[tool.ruff.lint]
extend-select = ["ANN"]


[[tool.release-ci.targets]]
platform = "linux"
arch = "x86_64"
runner = "ubuntu-latest"
target = "linux-x86_64"

[[tool.release-ci.targets]]
platform = "linux"
arch = "aarch64"
runner = "ubuntu-24.04-arm"
target = "linux-aarch64"

[[tool.release-ci.targets]]
platform = "windows"
arch = "AMD64"
runner = "windows-latest"
target = "windows-amd64"

[[tool.release-ci.targets]]
platform = "macos"
arch = "x86_64"
runner = "macos-15-intel"
target = "macos-x86_64"

[[tool.release-ci.targets]]
platform = "macos"
arch = "arm64"
runner = "macos-latest"
target = "macos-arm64"
