name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.12"

jobs:
  plan:
    name: Validate versions and release event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      version_only: ${{ steps.plan.outputs.version_only }}
      matrix: ${{ steps.wheels.outputs.matrix }}
      wheel-plan: ${{ steps.wheels.outputs.wheel-plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # version_only_change diffs against origin/main (PRs) or HEAD^:
          # merge refs carry no parents without full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - id: plan
        run: uv run --no-project --python 3.12 python ci/release_guard.py
      - id: wheels
        uses: LedFx/release-ci/actions/plan@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          source-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  lint:
    name: Lint and workflow security
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv run --frozen --only-group dev prek run --all-files
      - name: Release and Python quality guard regressions
        run: uv run --frozen --only-group dev python -m pytest ci -q

  native-kernel:
    name: Native Rust contracts
    needs: [plan, lint]
    if: needs.plan.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install native test toolchain
        run: |
          CHANNEL="$(sed -n 's/^channel *= *\"\([^\"]*\)\".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --component clippy --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"
          uv python install 3.12
      - name: Check formatting, lints and native contracts
        working-directory: native
        run: |
          PYO3_PYTHON="$(uv python find 3.12)"
          export PYO3_PYTHON
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo tree --locked -e features > "$RUNNER_TEMP/hue-provider-features.txt"
          cat "$RUNNER_TEMP/hue-provider-features.txt"
          if grep -Ei 'aws-lc|mbedtls|openssl|crypto-openssl|crypto-aws-lc' "$RUNNER_TEMP/hue-provider-features.txt"; then
            exit 1
          fi
          grep -F 'rtc-dtls feature "crypto-ring"' "$RUNNER_TEMP/hue-provider-features.txt"
          grep -F 'rtc-crypto feature "crypto-ring"' "$RUNNER_TEMP/hue-provider-features.txt"
          grep -F 'ring v0.17.14' "$RUNNER_TEMP/hue-provider-features.txt"
          # Keep the burst wire contract isolated from CPU-heavy SIMD tests.
          # Its packet assertions and intentional in-test concurrency stay intact.
          cargo test --locked --lib -- --skip transport::tests::real_socket_backends_preserve_batch_payloads
          cargo test --locked --lib transport::tests::real_socket_backends_preserve_batch_payloads -- --exact --test-threads=1
          cargo test --locked --bin ledfx-receiver
          cargo build --locked --release --bin ledfx-receiver
          "$PYO3_PYTHON" bench/receiver/test_receiver.py

  native-hue-interop:
    name: Mandatory native Hue and strict OpenSSL oracle
    needs: [lint, native-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Supply independent test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl
          CHANNEL="$(sed -n 's/^channel *= *\"\([^\"]*\)\".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"
          uv sync --frozen --group dev
          # Match run_probe's debug profile and Python before any oracle watchdog.
          PYO3_PYTHON="$(uv run --frozen --group dev python -c 'import sys; print(sys.executable)')"
          export PYO3_PYTHON
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> "$GITHUB_ENV"
          cargo build --manifest-path native/Cargo.toml --locked --example hue-probe
          uv run --frozen --only-group dev python ci/build_hue_oracle.py --output "$RUNNER_TEMP/hue-oracle" --github-env "$GITHUB_ENV"
      - name: Require native probe and public strict-oracle contracts
        run: uv run --frozen --group dev python -m pytest tests/test_hue_interop.py tests/test_hue_sender.py -q -rs

  native-wheels:
    name: Sender library wheels (${{ matrix.target }})
    needs: [plan, lint, native-kernel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install host native toolchain
        if: runner.os != 'Linux'
        run: |
          CHANNEL="$(sed -n 's/^channel *= *\"\([^\"]*\)\".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"
      # Linux builds and auditwheel repair occur inside pinned manylinux images.
      # Windows/macOS repair runs with cibuildwheel's platform tools.
      - name: Build portable sender library wheels
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: >-
          uv run --frozen --only-group wheel-build python -m cibuildwheel .
          --config-file pyproject.toml --platform "$PLATFORM" --archs "$ARCH"
          --output-dir wheelhouse
      - name: Audit repaired wheel provider linkage and record immutable identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            uv run --no-project --python 3.12 --with auditwheel==6.7.0 python ci/audit_native_wheels.py wheelhouse
          elif [[ "$RUNNER_OS" == macOS ]]; then
            uv run --no-project --python 3.12 --with delocate==0.13.0 python ci/audit_native_wheels.py wheelhouse
          else
            uv run --no-project --python 3.12 python ci/audit_native_wheels.py wheelhouse
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sender-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sender-audit-${{ matrix.target }}
          path: wheelhouse/native-wheel-audit.json
          if-no-files-found: error

  native-wheel-runtime:
    name: Installed native wheel (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: [native-wheels]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: windows-amd64
            runner: windows-latest
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-latest
        target: [linux-x86_64, linux-aarch64, windows-amd64, macos-x86_64, macos-arm64]
    defaults:
      run:
        shell: bash
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sender-wheel-${{ matrix.target }}
          path: wheelhouse
      - name: Supply Linux independent OpenSSL test headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl
      - name: Supply macOS OpenSSL 3 test tooling
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
      - name: Windows oracle command startup regressions
        if: runner.os == 'Windows'
        run: uv run --no-project --python 3.12 python -m unittest ci.test_hue_windows_tools -v
      - name: Build independent platform oracle and record OpenSSL versions
        shell: bash
        run: uv run --no-project --python 3.12 python ci/build_hue_oracle.py --output "$RUNNER_TEMP/hue-oracle" --github-env "$GITHUB_ENV"
      # No Rust installation or project sync: test the shipped binary itself.
      - name: Install selected sender wheel and its dependencies
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/sender-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/sender-wheel-venv" pytest hypothesis numpy
          uv pip install --python "$RUNNER_TEMP/sender-wheel-venv" --no-index --find-links "$GITHUB_WORKSPACE/wheelhouse" ledfx-senders
      - name: Strict typing against installed wheel only
        if: matrix.target == 'linux-x86_64' && matrix.python == '3.12'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir hue-installed-types
          cp "$GITHUB_WORKSPACE/ci/hue_typing_probe.py" hue-installed-types/
          printf 'preset = "strict"\nproject-includes = ["hue_typing_probe.py"]\nsearch-path = []\n' > hue-installed-types/pyrefly.toml
          uv run --project "$GITHUB_WORKSPACE" --frozen --only-group dev pyrefly check --config "$RUNNER_TEMP/hue-installed-types/pyrefly.toml" --python-interpreter-path "$RUNNER_TEMP/sender-wheel-venv/bin/python"
      - name: Native socket, buffer, control and cleanup smoke
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          if [[ "$PYTHON_VERSION" == *t ]]; then
            export LEDFX_REQUIRE_FREE_THREADING=1
          fi
          "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/ci/native_wheel_smoke.py"
          "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/ci/hue_wheel_smoke.py"
          "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I -m pytest --noconftest "$GITHUB_WORKSPACE/tests" -m "not native_probe" -q -rs
          if [[ "$PYTHON_VERSION" == *t ]]; then
            PYTHON_GIL=0 "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I -X gil=0 "$GITHUB_WORKSPACE/ci/native_wheel_smoke.py"
            PYTHON_GIL=0 "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I -X gil=0 "$GITHUB_WORKSPACE/ci/hue_wheel_smoke.py"
          fi
      - name: Native socket, buffer, control and cleanup smoke (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'sender-wheel-venv/Scripts/python.exe'
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'ci/native_wheel_smoke.py'
          $hueSmoke = Join-Path $env:GITHUB_WORKSPACE 'ci/hue_wheel_smoke.py'
          $tests = Join-Path $env:GITHUB_WORKSPACE 'tests'
          if ($env:PYTHON_VERSION.EndsWith('t')) { $env:LEDFX_REQUIRE_FREE_THREADING = '1' }
          & $python -I $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I $hueSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pytest --noconftest $tests -m 'not native_probe' -q -rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PYTHON_VERSION.EndsWith('t')) {
            $env:PYTHON_GIL = '0'
            & $python -I -X gil=0 $smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -I -X gil=0 $hueSmoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  sender-package:
    name: Assemble sender library distributions
    needs: [lint, native-kernel, native-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build one self-contained sender source distribution
        run: |
          uv build --sdist --out-dir sender-dist
          LEDFX_SDIST="$(find sender-dist -name '*.tar.gz' -print -quit)" uv run --frozen --only-group dev python -m pytest ci/test_sdist_content.py -q
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sender-wheel-*
          path: sender-dist
          merge-multiple: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sender-dist
          path: sender-dist/
          if-no-files-found: error

  source-install:
    name: Standalone source distribution
    needs: [sender-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sender-dist
          path: dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build and test outside any source checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev openssl
          CHANNEL="$(sed -n 's/^channel *= *\"\([^\"]*\)\".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal
          export RUSTUP_TOOLCHAIN="$CHANNEL"
          uv venv --python 3.12 "$RUNNER_TEMP/source-venv"
          uv pip install --python "$RUNNER_TEMP/source-venv" dist/*.tar.gz pytest hypothesis
          mkdir "$RUNNER_TEMP/source-tests"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/source-tests" --strip-components=1
          uv run --no-project --python 3.12 python "$RUNNER_TEMP/source-tests/ci/build_hue_oracle.py" --output "$RUNNER_TEMP/hue-oracle" --github-env "$GITHUB_ENV"
          export HUE_ORACLE="$RUNNER_TEMP/hue-oracle" LEDFX_REQUIRE_HUE_INTEROP=1
          cd "$RUNNER_TEMP"
          source-venv/bin/python -I source-tests/ci/native_wheel_smoke.py
          source-venv/bin/python -I source-tests/ci/hue_wheel_smoke.py
          source-venv/bin/python -I -m pytest --noconftest source-tests/tests -m "not native_probe" -q -rs

  ci-passed:
    name: CI passed
    if: always()
    needs: [plan, lint, native-kernel, native-hue-interop, native-wheels, native-wheel-runtime, sender-package, source-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Version-only changes legitimately skip the whole native matrix; their
      # diff cannot alter built artifacts. Anything else must actually run.
      - name: Require native coverage unless the diff is release metadata
        if: needs.plan.outputs.version_only != 'true' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped'))
        run: exit 1
      - name: Require lint and plan even for metadata-only changes
        if: contains(needs.lint.result, 'failure') || contains(needs.lint.result, 'cancelled') || contains(needs.plan.result, 'failure') || contains(needs.plan.result, 'cancelled')
        run: exit 1


  publish-release:
    name: Publish verified package release
    needs: [plan, ci-passed]
    if: github.repository == 'LedFx/ledfx-senders' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.release == 'true'
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sender-release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sender-dist
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github
            pyproject.toml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Mint scoped publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Freeze verified distributions and release identity
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: prepare
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/sender-release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Attest the tested distributions
        id: provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: check-upload
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/sender-release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Stage verified distributions for PyPI
        if: steps.upload.outputs.pypi_upload == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir pypi-dist
          cp -- dist/* pypi-dist/
      - name: Publish matching missing Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true # Both preflights require matching remote SHA-256.
      - name: Verify provenance and finalize existing GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: finalize
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/sender-release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: sender-provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sender-release-snapshot.json
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
