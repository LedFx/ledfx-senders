name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.12"

jobs:
  plan:
    name: Validate versions and release event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - id: plan
        run: uv run --no-project --python 3.12 python ci/release_guard.py

  lint:
    name: Lint and workflow security
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv run --frozen --only-group dev prek run --all-files
      - name: Release and Python quality guard regressions
        run: uv run --frozen --only-group dev python -m pytest ci -q

  native-kernel:
    name: Native Rust contracts
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install native test toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
          uv python install 3.12
      - name: Check formatting, lints and native contracts
        working-directory: native
        run: |
          PYO3_PYTHON="$(uv python find 3.12)"
          export PYO3_PYTHON
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # Keep the burst wire contract isolated from CPU-heavy SIMD tests.
          # Its packet assertions and intentional in-test concurrency stay intact.
          cargo test --locked --lib -- --skip transport::tests::real_socket_backends_preserve_batch_payloads
          cargo test --locked --lib transport::tests::real_socket_backends_preserve_batch_payloads -- --exact --test-threads=1
          cargo test --locked --bin ledfx-receiver
          cargo build --locked --release --bin ledfx-receiver
          "$PYO3_PYTHON" bench/receiver/test_receiver.py

  native-wheels:
    name: Sender library wheels (${{ matrix.target }})
    needs: [lint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: windows-latest
            target: windows-amd64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-latest
            target: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install host native toolchain
        if: runner.os != 'Linux'
        run: rustup toolchain install 1.94.0 --profile minimal
      # Linux builds and auditwheel repair occur inside pinned manylinux images.
      # Windows/macOS repair runs with cibuildwheel's platform tools.
      - name: Build portable sender library wheels
        run: uvx --from cibuildwheel==4.2.1 cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sender-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  native-wheel-runtime:
    name: Installed native wheel (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: [native-wheels]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: windows-amd64
            runner: windows-latest
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-latest
        target: [linux-x86_64, linux-aarch64, windows-amd64, macos-x86_64, macos-arm64]
    defaults:
      run:
        shell: bash
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sender-wheel-${{ matrix.target }}
          path: wheelhouse
      # No Rust installation or project sync: test the shipped binary itself.
      - name: Install selected sender wheel and its dependencies
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/sender-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/sender-wheel-venv" pytest hypothesis numpy
          uv pip install --python "$RUNNER_TEMP/sender-wheel-venv" --no-index --find-links "$GITHUB_WORKSPACE/wheelhouse" ledfx-senders
      - name: Native socket, buffer, control and cleanup smoke
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          if [[ "$PYTHON_VERSION" == *t ]]; then
            export LEDFX_REQUIRE_FREE_THREADING=1
          fi
          "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I "$GITHUB_WORKSPACE/ci/native_wheel_smoke.py"
          "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I -m pytest --noconftest "$GITHUB_WORKSPACE/tests" -q
          if [[ "$PYTHON_VERSION" == *t ]]; then
            PYTHON_GIL=0 "$RUNNER_TEMP/sender-wheel-venv/bin/python" -I -X gil=0 "$GITHUB_WORKSPACE/ci/native_wheel_smoke.py"
          fi
      - name: Native socket, buffer, control and cleanup smoke (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'sender-wheel-venv/Scripts/python.exe'
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'ci/native_wheel_smoke.py'
          $tests = Join-Path $env:GITHUB_WORKSPACE 'tests'
          if ($env:PYTHON_VERSION.EndsWith('t')) { $env:LEDFX_REQUIRE_FREE_THREADING = '1' }
          & $python -I $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -m pytest --noconftest $tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PYTHON_VERSION.EndsWith('t')) {
            $env:PYTHON_GIL = '0'
            & $python -I -X gil=0 $smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  sender-package:
    name: Assemble sender library distributions
    needs: [lint, native-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build one self-contained sender source distribution
        run: uv build --sdist --out-dir sender-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sender-wheel-*
          path: sender-dist
          merge-multiple: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sender-dist
          path: sender-dist/
          if-no-files-found: error

  source-install:
    name: Standalone source distribution
    needs: [sender-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sender-dist
          path: dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build and test outside any source checkout
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          uv venv --python 3.12 "$RUNNER_TEMP/source-venv"
          uv pip install --python "$RUNNER_TEMP/source-venv" dist/*.tar.gz pytest hypothesis
          mkdir "$RUNNER_TEMP/source-tests"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/source-tests" --strip-components=1
          cd "$RUNNER_TEMP"
          source-venv/bin/python -I source-tests/ci/native_wheel_smoke.py
          source-venv/bin/python -I -m pytest --noconftest source-tests/tests -q

  ci-passed:
    name: CI passed
    if: always()
    needs: [plan, lint, native-kernel, native-wheels, native-wheel-runtime, sender-package, source-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every build and installed test to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1


  publish-release:
    name: Publish verified package release
    needs: [plan, ci-passed]
    if: github.repository == 'LedFx/ledfx-senders' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.release == 'true'
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sender-release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sender-dist
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github
          path: release-tools
      - name: Mint scoped publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Freeze verified distributions and release identity
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@5e683ef142d08c81e46164062cff23aa1091d3f1 # v0.2.0
        with:
          phase: prepare
          policy: release-tools/.github/release-policy.json
          dist: dist
          snapshot: ${{ runner.temp }}/sender-release-snapshot.json
      - name: Attest the tested distributions
        id: provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@5e683ef142d08c81e46164062cff23aa1091d3f1 # v0.2.0
        with:
          phase: check-upload
          policy: release-tools/.github/release-policy.json
          dist: dist
          snapshot: ${{ runner.temp }}/sender-release-snapshot.json
      - name: Publish matching missing Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true # Both preflights require matching remote SHA-256.
      - name: Verify provenance and finalize existing GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@5e683ef142d08c81e46164062cff23aa1091d3f1 # v0.2.0
        with:
          phase: finalize
          policy: release-tools/.github/release-policy.json
          dist: dist
          snapshot: ${{ runner.temp }}/sender-release-snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: sender-provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sender-release-snapshot.json
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
