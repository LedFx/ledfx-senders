repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: actionlint
        name: actionlint and shellcheck
        entry: uv run --frozen --only-group dev actionlint
        language: system
        files: ^.github/workflows/
        require_serial: true
      - id: zizmor
        name: zizmor
        entry: uv run --frozen --only-group dev zizmor --no-progress --config .github/zizmor.yml --min-severity high .github/workflows/
        language: system
        files: ^.github/workflows/
        pass_filenames: false
      - id: pyrefly-check
        name: strict source, stub and test types
        entry: uv run --frozen --only-group dev --python 3.12 python ci/check_types.py
        language: system
        types_or: [python, pyi]
        pass_filenames: false
